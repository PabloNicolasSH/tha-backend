# Perfil "sso": activa el inicio de sesión con un proveedor OpenID Connect (Google, Microsoft Entra ID, Keycloak, Okta…).
# Arranca con:  SPRING_PROFILES_ACTIVE=sso   (o  dev,sso  en local)
#
# Variables:
#   THA_SSO_ISSUER         URL del emisor OIDC (debe publicar /.well-known/openid-configuration)
#                          Google:    https://accounts.google.com
#                          Microsoft: https://login.microsoftonline.com/<tenant-id>/v2.0
#                          Keycloak:  https://<host>/realms/<realm>
#   THA_SSO_CLIENT_ID      identificador de la aplicación registrada en el proveedor
#   THA_SSO_CLIENT_SECRET  secreto de la aplicación
#   THA_SSO_NAME           texto del botón ("Entrar con …"), p. ej. Google
#
# URL de redirección que hay que registrar en el proveedor:  <URL pública de Tha>/login/oauth2/code/sso
# (en local: http://localhost:4200/login/oauth2/code/sso, el proxy de Angular la lleva al backend)

spring.security.oauth2.client.registration.sso.client-id=${THA_SSO_CLIENT_ID}
spring.security.oauth2.client.registration.sso.client-secret=${THA_SSO_CLIENT_SECRET}
spring.security.oauth2.client.registration.sso.client-name=${THA_SSO_NAME:Cuenta corporativa}
spring.security.oauth2.client.registration.sso.scope=openid,profile,email
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.sso.issuer-uri=${THA_SSO_ISSUER}
