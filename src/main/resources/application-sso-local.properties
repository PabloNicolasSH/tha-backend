# Perfil "sso-local": SSO contra el Keycloak de pruebas de compose.yaml.
#   docker compose --profile sso up -d      (Keycloak en http://localhost:8180, admin / admin)
#   perfiles de Spring:  dev,sso-local
#
# Usuarios de prueba del realm "tha" (keycloak/tha-realm.json), contraseña de ambos: sso-dev-clave-2026
#   lucia.e2e@example.org   -> tiene cuenta en Tha: entra
#   sin.cuenta@example.org  -> no tiene cuenta en Tha: ve el aviso "sin cuenta"
#
# Importante: Keycloak debe estar levantado ANTES de arrancar el backend (lee su configuración al iniciar).
# Solo desarrollo: no usar este secreto fuera de local.

spring.security.oauth2.client.registration.sso.client-id=tha
spring.security.oauth2.client.registration.sso.client-secret=tha-dev-secret
spring.security.oauth2.client.registration.sso.client-name=Cuenta corporativa (local)
spring.security.oauth2.client.registration.sso.scope=openid,profile,email
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.sso.issuer-uri=http://localhost:8180/realms/tha
