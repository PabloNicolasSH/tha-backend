# Perfil de desarrollo local. Arranca MySQL y Mailpit con:  docker compose up -d
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/tha}
spring.datasource.username=${DATABASE_USERNAME:tha}
spring.datasource.password=${DATABASE_PASSWORD:tha}

# Solo desarrollo. En producción JWT_SECRET es obligatorio y distinto.
tha.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
tha.cors.allowed-origin=${THA_FRONTEND_URL:http://localhost:4200}
tha.frontend-url=${THA_FRONTEND_URL:http://localhost:4200}

# Solo desarrollo: clave del cifrado de secretos 2FA
tha.mfa.encryption-key=${MFA_ENCRYPTION_KEY:ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy1sb25nISE=}

# En local no hay HTTPS: la cookie del refresh token no puede ser "Secure"
tha.refresh.cookie-secure=false

# Mailpit (bandeja de pruebas): http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Cuenta administradora creada al arrancar si no existe ningún usuario (solo en dev)
tha.bootstrap-admin.email=admin@tha.local
tha.bootstrap-admin.password=admin12345

logging.level.org.scoutsdecanarias=DEBUG
