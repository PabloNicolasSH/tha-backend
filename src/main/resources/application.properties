spring.application.name=tha-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Access token: JWT de vida corta (HS256 por ahora; se puede pasar a RS256 sin tocar los controladores)
tha.jwt.secret=${JWT_SECRET}
tha.jwt.issuer=tha
tha.jwt.expiration=PT15M

# Refresh token: opaco, guardado hasheado en BD, rota en cada uso y viaja en cookie HttpOnly.
# expiration: con "Mantener sesión iniciada". session-expiration: sin marcarlo (cookie de sesión).
tha.refresh.expiration=P30D
tha.refresh.session-expiration=PT12H
tha.refresh.cookie-secure=true

# Enlace para crear la contraseña tras aprobar la cuenta. Los tokens viven en memoria (Caffeine):
# si el servidor se reinicia hay que reenviar la invitación.
tha.invite.expiration=PT48H
tha.frontend-url=${THA_FRONTEND_URL}
tha.mail.from=${MAIL_FROM:no-reply@tha.local}

# Origen permitido del frontend (CORS)
tha.cors.allowed-origin=${THA_FRONTEND_URL}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Segundo factor (2FA). La clave cifra los secretos TOTP en la BD: 32 bytes en Base64, secreta y estable
# (si se cambia, los usuarios tendrían que volver a configurar su app autenticadora).
tha.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
tha.mfa.issuer=Tha
tha.mfa.email-code-ttl=PT10M
tha.mfa.token-ttl=PT5M

# Detrás de un proxy inverso (HTTPS en producción): respeta X-Forwarded-* para construir las URL del SSO
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
