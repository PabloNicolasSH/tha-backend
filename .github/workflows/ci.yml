name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Una ejecución nueva sobre la misma rama cancela la anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila y ejecuta todos los tests. Los de integración usan Testcontainers
      # (MySQL 8.4): el runner ubuntu-latest trae Docker, no hace falta configurar nada.
      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
